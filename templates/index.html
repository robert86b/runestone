<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runestone">
<link rel="manifest" href="/static/manifest.webmanifest">

<title>Runestone</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#111;color:#eee;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{display:flex;min-height:100vh}
.sidebar{
width:300px;background:#171717;border-right:1px solid #292929;
padding:22px;position:fixed;top:0;bottom:0;overflow:auto;
}
.brand{font-size:23px;font-weight:800;margin-bottom:24px}
.brand span{color:#d71920}
.search{display:flex;gap:7px;margin-bottom:15px}
input{
width:100%;background:#222;border:1px solid #333;color:white;
padding:11px;border-radius:8px;font-size:15px;
}
button{
border:0;border-radius:8px;padding:10px 13px;
font-weight:650;cursor:pointer;
}
.primary{background:#d71920;color:white}
.section{
font-size:11px;color:#777;font-weight:800;
letter-spacing:.09em;margin:22px 4px 9px;
}
.note{
display:block;color:#ccc;text-decoration:none;
padding:9px 10px;border-radius:7px;margin:2px 0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.note:hover{background:#242424;color:white}
.main{margin-left:300px;width:calc(100% - 300px);padding:55px}
.hero{max-width:800px;margin:auto}
h1{font-size:42px;margin:0 0 10px}
.subtitle{color:#888;margin-bottom:30px}
.card{
background:#181818;border:1px solid #292929;
border-radius:13px;padding:22px;margin-bottom:12px;
text-decoration:none;color:white;display:block;
}
.card:hover{border-color:#444}
.date{color:#777;font-size:13px;margin-top:7px}
.mobile-head{display:none}
.mobile-tools{display:none}

@media(max-width:760px){
.sidebar{display:none}
.main{margin:0;width:100%;padding:24px 18px 90px}
.mobile-head{
display:block;font-size:23px;font-weight:800;
padding-top:calc(10px + env(safe-area-inset-top));
margin-bottom:24px
}
.mobile-tools{
display:block;
margin-bottom:30px
}
.mobile-tools form{
display:flex;
gap:9px;
margin-bottom:10px
}
.mobile-tools input{
flex:1;
min-width:0
}
.mobile-tools button{
flex:none
}
.mobile-new{
width:100%;
font-size:16px;
padding:13px 16px
}
h1{font-size:34px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="brand"><span>◆</span> Runestone</div>

<form class="search" action="/search">
<input name="q" placeholder="Search..."
value="{{ search or '' }}">
<button class="primary">⌕</button>
</form>

<form action="/new" method="post">
<div class="search">
<input name="title" placeholder="New document" required>
<button class="primary">+</button>
</div>
</form>

<div class="section">DOCUMENTS</div>

{% for note in notes %}
<a class="note" href="/note/{{ note.file }}">
▤ {{ note.name }}
</a>
{% endfor %}
</aside>

<main class="main">
<div class="hero">

<div class="mobile-head">◆ Runestone</div>

<div class="mobile-tools">

<form action="/search">
<input
name="q"
placeholder="Search documents..."
value="{{ search or '' }}"
>
<button class="primary">Search</button>
</form>

<form action="/new" method="post">
<input
name="title"
placeholder="Document name..."
required
>
<button class="primary">+ New</button>
</form>

</div>

<h1>Your documents</h1>
<div class="subtitle">
Your private Markdown workspace on Ragnar.
</div>

{% for note in notes %}
<a class="card" href="/note/{{ note.file }}">
<strong>{{ note.name }}</strong>
<div class="date">Edited {{ note.modified }}</div>
</a>
{% else %}
<p>No documents yet.</p>
{% endfor %}

</div>
</main>

</div>

<script>
if("serviceWorker" in navigator){
navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
